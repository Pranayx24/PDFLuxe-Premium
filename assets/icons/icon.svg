<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="gold"
      x1="80"
      y1="40"
      x2="430"
      y2="470"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFF1C4"/>
      <stop offset="0.45" stop-color="#F4C76B"/>
      <stop offset="1" stop-color="#C88B28"/>
    </linearGradient>

    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="512"
      y2="512"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#181820"/>
      <stop offset="1" stop-color="#07070A"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.45"
      />
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#bg)"
  />

  <!-- Premium border -->
  <rect
    x="10"
    y="10"
    width="492"
    height="492"
    rx="102"
    fill="none"
    stroke="url(#gold)"
    stroke-opacity="0.28"
    stroke-width="3"
  />

  <!-- Document -->
  <g filter="url(#shadow)">
    <path
      d="M145 82
         H303
         L367 146
         V430
         H145
         Z"
      fill="#F7F7F8"
    />

    <!-- Fold -->
    <path
      d="M303 82
         V146
         H367"
      fill="#DADAE0"
    />

    <path
      d="M303 82
         L367 146
         H303
         Z"
      fill="#BDBDC5"
    />

    <!-- PDF lines -->
    <rect
      x="184"
      y="206"
      width="144"
      height="13"
      rx="6.5"
      fill="#D0D0D7"
    />

    <rect
      x="184"
      y="242"
      width="104"
      height="13"
      rx="6.5"
      fill="#D0D0D7"
    />

    <rect
      x="184"
      y="278"
      width="128"
      height="13"
      rx="6.5"
      fill="#D0D0D7"
    />
  </g>

  <!-- Luxe P -->
  <circle
    cx="256"
    cy="354"
    r="58"
    fill="#08080B"
    stroke="url(#gold)"
    stroke-width="5"
  />

  <path
    d="M235 389
       V318
       H263
       C283 318
       294 329
       294 346
       C294 363
       283 374
       263 374
       H248"
    fill="none"
    stroke="url(#gold)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Shine -->
  <circle
    cx="390"
    cy="112"
    r="5"
    fill="#FFF1C4"
  />

  <circle
    cx="410"
    cy="132"
    r="3"
    fill="#F4C76B"
  />

</svg>
