<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#08080b"
  />

  <title>Page Not Found — PDFLuxe Premium</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fafafa;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          700px 500px at 50% 20%,
          rgba(244, 199, 107, 0.11),
          transparent 65%
        ),
        #08080b;
    }

    .card {
      width: min(560px, 100%);
      padding: 48px 32px;
      text-align: center;

      border: 1px solid #282830;
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.015)
        );

      box-shadow:
        0 35px 100px rgba(0,0,0,.5);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 24px;

      display: grid;
      place-items: center;

      border-radius: 17px;

      color: #17110a;
      font-size: 25px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #fff1c4,
          #f4c76b,
          #c88b28
        );

      box-shadow:
        0 12px 35px rgba(244,199,107,.18);
    }

    .code {
      margin: 0;

      font-size: 86px;
      line-height: .9;
      font-weight: 800;
      letter-spacing: -6px;

      background:
        linear-gradient(
          100deg,
          #fff,
          #ffe4a0,
          #b993ff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 24px 0 10px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    p {
      margin: 0 auto 28px;
      max-width: 420px;

      color: #9696a3;
      line-height: 1.7;
      font-size: 15px;
    }

    a {
      display: inline-block;

      padding: 13px 19px;
      border-radius: 12px;

      color: #17110a;
      text-decoration: none;
      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #ffe6a0,
          #d99f3b
        );

      box-shadow:
        0 12px 35px rgba(244,199,107,.15);
    }

    .brand {
      margin-top: 28px;
      color: #666671;
      font-size: 12px;
    }

    .brand strong {
      color: #bcbcc5;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      P
    </div>

    <div class="code">
      404
    </div>

    <h1>
      This page got misplaced.
    </h1>

    <p>
      The document you're looking for doesn't exist here.
      Let's get you back to your PDF workspace.
    </p>

    <a href="./">
      ← Back to PDFLuxe
    </a>

    <div class="brand">
      <strong>PDFLuxe Premium</strong>
      · Your PDF, elevated.
    </div>

  </main>

</body>
</html>
